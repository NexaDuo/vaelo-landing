name: Deploy

# Publishes vaelo.club to Cloudflare Workers, then pings IndexNow.
# GitHub-hosted runner on purpose: this repository is public.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish hotsite to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare settings
        id: settings
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.settings.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to Cloudflare Workers
        if: steps.settings.outputs.ready == 'true'
        run: npx --yes wrangler@4.160.0 deploy

      - name: Set up Python
        if: steps.settings.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Submit to IndexNow
        if: steps.settings.outputs.ready == 'true'
        env:
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
        run: python3 submit-indexnow.py
